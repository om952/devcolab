name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  node:
    name: Node (build, typecheck, test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devcolab
          POSTGRES_PASSWORD: devcolab
          POSTGRES_DB: devcolab
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U devcolab -d devcolab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://devcolab:devcolab@localhost:5433/devcolab
      # No pooler in CI's plain Postgres container, so this is the same URL.
      DIRECT_URL: postgresql://devcolab:devcolab@localhost:5433/devcolab
      JWT_SECRET: ci-test-jwt-secret-minimum16chars
      CORS_ORIGIN: http://localhost:3000
      AI_SERVICE_URL: http://localhost:8000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations
        # migrate deploy (not db push) so drift between the schema and the
        # committed migration history fails the build.
        run: npx prisma migrate deploy

      - name: Verify migrations match the schema
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code && echo "No drift detected"

      - name: Build workspace packages
        run: |
          pnpm build:types
          pnpm --filter @devcolab/database build

      - name: Typecheck collab-server
        run: pnpm --filter @devcolab/collab-server typecheck

      - name: Build collab-server
        run: pnpm build:collab

      - name: Test collab-server
        run: pnpm --filter @devcolab/collab-server test

      - name: Build web
        run: pnpm build:web

  python:
    name: Python (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/ai-service/requirements-dev.txt

      - name: Install dependencies
        # --require-hashes so CI installs exactly what the image will.
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  docker:
    name: Docker build and image scan
    runs-on: ubuntu-latest
    needs: [node, python]

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: collab-server
            dockerfile: apps/collab-server/Dockerfile
          - name: ai-service
            dockerfile: apps/ai-service/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: devcolab-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Reported for visibility but not blocking: HIGH findings in upstream base
      # images are common and often outside our control.
      - name: Report HIGH and CRITICAL vulnerabilities in ${{ matrix.name }}
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: devcolab-${{ matrix.name }}:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      # Blocking: a fixable CRITICAL must not reach main.
      - name: Fail on fixable CRITICAL vulnerabilities in ${{ matrix.name }}
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: devcolab-${{ matrix.name }}:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devcolab
          POSTGRES_PASSWORD: devcolab
          POSTGRES_DB: devcolab
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U devcolab -d devcolab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://devcolab:devcolab@localhost:5433/devcolab
      DIRECT_URL: postgresql://devcolab:devcolab@localhost:5433/devcolab

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare database and packages
        run: |
          npx prisma generate
          npx prisma migrate deploy
          pnpm build:types
          pnpm --filter @devcolab/database build
          pnpm build:collab

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The Playwright config builds the web app itself so NEXT_PUBLIC_* is
      # inlined against the port the test collab-server actually listens on.
      - name: Run browser smoke tests
        run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  compose:
    name: Compose config validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fails without required secrets
        run: |
          if docker compose --env-file /dev/null config >/dev/null 2>&1; then
            echo "::error::compose accepted a config with no secrets set"
            exit 1
          fi
          echo "Required-secret guards fire as expected"

      - name: Valid with secrets supplied
        env:
          JWT_SECRET: ci-compose-secret-minimum-16-chars
          INTERNAL_API_KEY: ci-compose-internal-key-32-characters
          CORS_ORIGIN: http://localhost:3000
        run: docker compose config >/dev/null && echo "compose config valid"

      - name: Production overlay is valid and exposes nothing but Caddy
        env:
          JWT_SECRET: ci-compose-secret-minimum-16-chars
          INTERNAL_API_KEY: ci-compose-internal-key-32-characters
          CORS_ORIGIN: https://app.example.com
          POSTGRES_USER: devcolab
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: devcolab
          DEVCOLAB_DOMAIN: app.example.com
          DEVCOLAB_API_DOMAIN: api.example.com
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config \
            > /tmp/prod-config.yml
          python3 - <<'PY'
          import yaml
          cfg = yaml.safe_load(open("/tmp/prod-config.yml"))
          exposed = {
              name: [p.get("published") for p in (svc.get("ports") or [])]
              for name, svc in cfg["services"].items()
              if svc.get("ports")
          }
          assert set(exposed) == {"caddy"}, f"only caddy may publish ports, got: {exposed}"
          assert sorted(exposed["caddy"]) == ["443", "80"], exposed["caddy"]
          print("production overlay exposes only caddy:80,443")
          PY

      - name: Neon overlay is valid and never starts the postgres container
        env:
          JWT_SECRET: ci-compose-secret-minimum-16-chars
          INTERNAL_API_KEY: ci-compose-internal-key-32-characters
          CORS_ORIGIN: https://app.example.com
          DEVCOLAB_DOMAIN: app.example.com
          DEVCOLAB_API_DOMAIN: api.example.com
          DATABASE_URL: postgresql://user:pass@ep-xxx-pooler.region.aws.neon.tech/devcolab?sslmode=require
          DIRECT_URL: postgresql://user:pass@ep-xxx.region.aws.neon.tech/devcolab?sslmode=require
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            -f docker-compose.neon.yml config > /tmp/neon-config.yml
          python3 - <<'PY'
          import yaml
          cfg = yaml.safe_load(open("/tmp/neon-config.yml"))
          services = cfg["services"]
          assert "postgres" not in cfg.get("services", {}) or \
              services["postgres"].get("profiles") == ["disabled"], \
              "postgres must carry the disabled profile in the neon overlay"
          for name in ("collab-server", "ai-service"):
              db_url = services[name]["environment"]["DATABASE_URL"]
              assert "neon.tech" in db_url, f"{name} DATABASE_URL not overridden: {db_url}"
              deps = services[name].get("depends_on", {})
              assert "postgres" not in deps, f"{name} still depends_on postgres: {deps}"
          print("neon overlay disables postgres and rewires DATABASE_URL")
          PY

      - name: Preflight rejects weak secrets
        run: |
          set +e
          JWT_SECRET=devcolab-jwt-secret-change-in-production \
          INTERNAL_API_KEY=ci-compose-internal-key-32-characters \
          POSTGRES_PASSWORD=devcolab \
          CORS_ORIGIN=http://localhost:3000 \
          DEVCOLAB_DOMAIN=app.example.com \
          DEVCOLAB_API_DOMAIN=api.example.com \
          DATABASE_URL=postgresql://u:p@localhost/db \
          ./scripts/preflight.sh --skip-dns --skip-db
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "::error::preflight accepted known-weak secrets"
            exit 1
          fi
          echo "preflight correctly rejected weak secrets"

      - name: Preflight passes with strong secrets
        run: |
          JWT_SECRET=$(openssl rand -hex 32) \
          INTERNAL_API_KEY=$(openssl rand -hex 32) \
          POSTGRES_PASSWORD=$(openssl rand -hex 16) \
          CORS_ORIGIN=https://app.example.com \
          DEVCOLAB_DOMAIN=app.example.com \
          DEVCOLAB_API_DOMAIN=api.example.com \
          DATABASE_URL=postgresql://u:p@localhost/db \
          ./scripts/preflight.sh --skip-dns --skip-db
