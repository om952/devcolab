# Production overlay. Use together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Differences from the base (development) file:
#   - Postgres and Redis are not published to the host; only the internal
#     network can reach them.
#   - Caddy terminates TLS and is the only public entry point.
#   - App services bind to the internal network instead of publishing ports.
#   - Resource limits, log rotation and readiness-based health checks.

services:
  postgres:
    ports: !override []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    deploy:
      resources:
        limits:
          memory: 1g
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    ports: !override []
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    deploy:
      resources:
        limits:
          memory: 384m
    logging: *logging

  collab-server:
    ports: !override []
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Behind Caddy, so trust exactly one proxy hop for client IPs.
      - TRUST_PROXY=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=collab-server
    healthcheck:
      # Readiness, not liveness — do not route traffic to an instance that
      # cannot reach its database.
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *logging

  ai-service:
    ports: !override []
    environment:
      - ENVIRONMENT=production
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=ai-service
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready').status==200 else 1)\" || exit 1",
        ]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logging

  web:
    ports: !override []
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *logging

  # Public entry point. Terminates TLS (certificates issued automatically by
  # Let's Encrypt) and proxies to the internal services.
  caddy:
    image: caddy:2-alpine
    container_name: devcolab-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DEVCOLAB_DOMAIN=${DEVCOLAB_DOMAIN:?DEVCOLAB_DOMAIN must be set, e.g. devcolab.example.com}
      - DEVCOLAB_API_DOMAIN=${DEVCOLAB_API_DOMAIN:?DEVCOLAB_API_DOMAIN must be set, e.g. api.devcolab.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - collab-server
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
